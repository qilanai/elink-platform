server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location = /apps/workspace { return 308 /apps/workspace/; }
    location = /apps/workspace/index.html {
        add_header Cache-Control "no-store";
    }
    location /apps/workspace/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /apps/workspace/ {
        try_files $uri $uri/ /apps/workspace/index.html;
    }
    location / { return 404; }
}
